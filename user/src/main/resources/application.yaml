server:
  port: 8081

spring:
  application:
    name: user-service
  
  datasource:
    url: ${DB_USER_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- C'EST ICI QUE ÇA SE JOUE ---
  # Sans ça, le User Service rejette tout le monde (401)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/humble-realm/protocol/openid-connect/certs
  # --------------------------------

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  keycloak:
    server-url: http://localhost:9090
    realm: humble-realm
    client-id: admin-cli
    client-secret: ""
    username: admin
    password: admin