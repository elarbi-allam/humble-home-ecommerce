server:
  port: 8081

spring:
  application:
    name: user-service
  
  # Configuration Base de Données SÉCURISÉE
  datasource:
    url: ${DB_URL}           # Va chercher dans .env
    username: ${DB_USERNAME} # Va chercher dans .env
    password: ${DB_PASSWORD} # Va chercher dans .env
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true