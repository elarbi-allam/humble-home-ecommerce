version: '3.8'

services:
  # Base de données pour Keycloak (Optionnel pour le dev, mais plus propre)
  postgres-keycloak:
    image: postgres:15
    container_name: humble-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data

  # Le Serveur Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: humble-keycloak
    command: start-dev # Mode développement (plus rapide, pas de HTTPS forcé)
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9090:8080" # On map le 8080 du conteneur vers ton 9090 local
    depends_on:
      - postgres-keycloak

volumes:
  postgres_keycloak_data: